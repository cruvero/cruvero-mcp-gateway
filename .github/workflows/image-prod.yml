name: Build And Push Production Image

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.REGISTRY_URL || vars.REGISTRY_URL || 'registry.example.com' }}
  REGISTRY_PROJECT: <PROJECT>
  IMAGE_NAME: <IMAGE>
  DOCKER_PROXY: docker.io
  GCR_PROXY: gcr.io
  GOPROXY: https://proxy.golang.org,direct

jobs:
  docker-build-push:
    runs-on: <RUNNER_LABELS>
    steps:
      - uses: actions/checkout@v6

      - name: Normalize Registry URL
        shell: bash
        run: |
          set -euo pipefail
          registry="${REGISTRY:-registry.example.com}"
          registry="${registry#https://}"
          registry="${registry#http://}"
          registry="${registry%/}"
          echo "REGISTRY_NORM=${registry}" >> "$GITHUB_ENV"

      - name: Login To Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_NORM }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Build Image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -f ./Dockerfile \
            --build-arg DOCKER_PROXY="${DOCKER_PROXY}" \
            --build-arg GCR_PROXY="${GCR_PROXY}" \
            --build-arg GOPROXY="${GOPROXY}" \
            -t "${REGISTRY_NORM}/${REGISTRY_PROJECT}/${IMAGE_NAME}:${GITHUB_REF_NAME}" \
            -t "${REGISTRY_NORM}/${REGISTRY_PROJECT}/${IMAGE_NAME}:latest" \
            .

      - name: Push Image
        shell: bash
        run: |
          set -euo pipefail
          docker push "${REGISTRY_NORM}/${REGISTRY_PROJECT}/${IMAGE_NAME}:${GITHUB_REF_NAME}"
          docker push "${REGISTRY_NORM}/${REGISTRY_PROJECT}/${IMAGE_NAME}:latest"
