name: CI

on:
  push:
    branches:
      - main
      - dev
    paths-ignore:
      - docs/**
      - '**/*.md'
      - LICENSE
  pull_request:
    paths-ignore:
      - docs/**
      - '**/*.md'
      - LICENSE

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.1'
  GOLANGCI_LINT_VERSION: v2.10.1
  STATICCHECK_VERSION: v0.7.0
  DUPL_VERSION: v1.0.0
  GOVULNCHECK_VERSION: v1.1.4
  GOSEC_VERSION: v2.23.0
  ACTIONLINT_VERSION: v1.7.8

jobs:
  smoke:
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Smoke Build
        run: go build ./cmd/mcpgw
      - name: Smoke Tests
        run: go test -count=1 ./cmd/mcpgw ./internal/server -run 'TestServeWithContextInitializesAndShutsDown|TestHealthzReturns200|TestReadyzReturns200'

  test:
    if: github.event_name != 'push' || github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Test
        run: go test -race ./...

  lint:
    if: github.event_name != 'push' || github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        id: setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Resolve Go Bin Dir
        id: go-bin
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(go env GOBIN)" ]; then
            echo "dir=$(go env GOBIN)" >> "$GITHUB_OUTPUT"
          else
            echo "dir=$(go env GOPATH)/bin" >> "$GITHUB_OUTPUT"
          fi
      - name: Add Go Bin to PATH
        run: echo "${{ steps.go-bin.outputs.dir }}" >> "$GITHUB_PATH"
      - name: Restore Go Tool Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-bin.outputs.dir }}
          key: ${{ runner.os }}-go-tools-${{ hashFiles('go.mod', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-
      - name: Install Lint and Analysis Tooling
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v golangci-lint >/dev/null 2>&1 || ! golangci-lint version | grep -q "${GOLANGCI_LINT_VERSION#v}"; then
            go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@"${GOLANGCI_LINT_VERSION}"
          fi
          if ! command -v staticcheck >/dev/null 2>&1 || ! staticcheck -version | grep -q "${STATICCHECK_VERSION#v}"; then
            go install honnef.co/go/tools/cmd/staticcheck@"${STATICCHECK_VERSION}"
          fi
          if ! command -v dupl >/dev/null 2>&1; then
            go install github.com/mibk/dupl@"${DUPL_VERSION}"
          fi
          if ! command -v actionlint >/dev/null 2>&1; then
            go install github.com/rhysd/actionlint/cmd/actionlint@"${ACTIONLINT_VERSION}"
          fi
      - name: Run golangci-lint
        run: golangci-lint run ./...
      - name: Run staticcheck
        run: staticcheck ./...
      - name: Run go vet
        run: go vet ./...
      - name: Run actionlint (non-blocking)
        continue-on-error: true
        run: actionlint .github/workflows/ci.yml
      - name: Check Go doc coverage (exported declarations)
        run: ./scripts/check-godoc.sh
      - name: Check duplicate code
        run: ./scripts/check-dupl.sh

  build:
    if: github.event_name != 'push' || github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build
        run: go build ./cmd/mcpgw

  coverage:
    if: github.event_name != 'push' || github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Check Coverage Thresholds
        run: ./scripts/check-coverage.sh

  integration:
    if: github.event_name != 'push' || github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcpgw_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -U postgres -d mcpgw_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Run Integration Tests
        env:
          MCPGW_TEST_DB_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/mcpgw_test?sslmode=disable
        run: go test -tags integration ./internal/testutil -run 'TestFullLifecycle|TestAuthFlow'

  security:
    if: github.event_name != 'push' || github.ref != 'refs/heads/dev'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        id: setup-go
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Resolve Go Bin Dir
        id: go-bin
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(go env GOBIN)" ]; then
            echo "dir=$(go env GOBIN)" >> "$GITHUB_OUTPUT"
          else
            echo "dir=$(go env GOPATH)/bin" >> "$GITHUB_OUTPUT"
          fi
      - name: Add Go Bin to PATH
        run: echo "${{ steps.go-bin.outputs.dir }}" >> "$GITHUB_PATH"
      - name: Restore Go Tool Cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.go-bin.outputs.dir }}
          key: ${{ runner.os }}-go-tools-${{ hashFiles('go.mod', '.github/workflows/ci.yml') }}
          restore-keys: |
            ${{ runner.os }}-go-tools-
      - name: Install Security Tooling
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v govulncheck >/dev/null 2>&1; then
            go install golang.org/x/vuln/cmd/govulncheck@"${GOVULNCHECK_VERSION}"
          fi
          if ! command -v gosec >/dev/null 2>&1; then
            go install github.com/securego/gosec/v2/cmd/gosec@"${GOSEC_VERSION}"
          fi
      - name: Run govulncheck
        run: govulncheck ./...
      - name: Run gosec (high severity gate)
        run: ./scripts/check-gosec.sh
      - name: Run security-tagged tests
        run: go test -tags security ./internal/testutil
