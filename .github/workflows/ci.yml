name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  test:
    runs-on:
      group: cruvero-org-runners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: false
      - name: Test
        run: go test -race ./...

  lint:
    runs-on:
      group: cruvero-org-runners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: false
      - name: Add Go Bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install Lint and Analysis Tooling
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@latest
          go install honnef.co/go/tools/cmd/staticcheck@latest
          go install github.com/mibk/dupl@latest
      - name: Run golangci-lint
        run: golangci-lint run ./...
      - name: Run staticcheck
        run: staticcheck ./...
      - name: Run go vet
        run: go vet ./...
      - name: Check Go doc coverage (exported declarations)
        run: ./scripts/check-godoc.sh
      - name: Check duplicate code
        run: ./scripts/check-dupl.sh

  build:
    runs-on:
      group: cruvero-org-runners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: false
      - name: Build
        run: go build ./cmd/mcpgw

  coverage:
    runs-on:
      group: cruvero-org-runners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: false
      - name: Check Coverage Thresholds
        run: ./scripts/check-coverage.sh

  integration:
    runs-on:
      group: cruvero-org-runners
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcpgw_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -U postgres -d mcpgw_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: false
      - name: Run Integration Tests
        env:
          MCPGW_TEST_DB_URL: postgres://postgres:postgres@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/mcpgw_test?sslmode=disable
        run: go test -tags integration ./internal/testutil -run 'TestFullLifecycle|TestAuthFlow'

  security:
    runs-on:
      group: cruvero-org-runners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: false
      - name: Add Go Bin to PATH
        run: echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Install Security Tooling
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          go install github.com/securego/gosec/v2/cmd/gosec@latest
      - name: Run govulncheck
        run: govulncheck ./...
      - name: Run gosec (high severity gate)
        run: ./scripts/check-gosec.sh
      - name: Run security-tagged tests
        run: go test -tags security ./internal/testutil

  sonar:
    runs-on:
      group: cruvero-org-runners
    if: github.event_name == 'push' && vars.SONAR_ENABLED == 'true'
    needs: [test, coverage]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.7'
          cache: false
      - name: Generate Coverage and Test Reports
        run: go test -coverprofile=coverage.out -covermode=atomic -json ./... > test-report.json || true
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v7
        with:
          args: -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
