name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:

jobs:
  test:
    runs-on: cruvero-org-runners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Test
        run: go test -race ./...

  lint:
    runs-on: cruvero-org-runners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Lint
        run: golangci-lint run ./...

  build:
    runs-on: cruvero-org-runners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Build
        run: go build ./cmd/mcpgw

  coverage:
    runs-on: cruvero-org-runners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Check Coverage Thresholds
        run: ./scripts/check-coverage.sh

  integration:
    runs-on: cruvero-org-runners
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mcpgw_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mcpgw_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      nats:
        image: nats:2.10-alpine
        ports:
          - 4222:4222
    env:
      MCPGW_TEST_DB_URL: postgres://postgres:postgres@localhost:5432/mcpgw_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Run Integration Tests
        run: go test -tags integration ./internal/testutil -run 'TestFullLifecycle|TestAuthFlow'

  security:
    runs-on: cruvero-org-runners
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Run Security Tests
        run: go test -tags security ./internal/testutil
