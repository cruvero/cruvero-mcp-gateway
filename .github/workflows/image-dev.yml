name: Build And Push Dev Image

on:
  push:
    branches:
      - dev

permissions:
  contents: read

env:
  REGISTRY: ${{ secrets.HARBOR_URL || vars.HARBOR_URL || 'harbor.dev.gchinfo.com' }}
  HARBOR_PROJECT: cruvero
  # Self-hosted runner uses an older Docker Engine API (max ~1.41). Force the client to match.
  DOCKER_API_VERSION: "1.41"

jobs:
  docker-build-push:
    runs-on: [self-hosted, cruvero]
    steps:
      - uses: actions/checkout@v4

      - name: Normalize Harbor Registry
        shell: bash
        run: |
          set -euo pipefail
          registry="${REGISTRY:-harbor.dev.gchinfo.com}"
          registry="${registry#https://}"
          registry="${registry#http://}"
          registry="${registry%/}"
          echo "REGISTRY_NORM=${registry}" >> "$GITHUB_ENV"

      - name: Login To Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY_NORM }}
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD || secrets.HARBOR_TOKEN }}

      - name: Build Image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -f ./Dockerfile \
            -t "${REGISTRY_NORM}/${HARBOR_PROJECT}/cruvero-mcp-gateway:dev-${GITHUB_SHA}" \
            -t "${REGISTRY_NORM}/${HARBOR_PROJECT}/cruvero-mcp-gateway:dev" \
            .

      - name: Push Image
        shell: bash
        run: |
          set -euo pipefail
          docker push "${REGISTRY_NORM}/${HARBOR_PROJECT}/cruvero-mcp-gateway:dev-${GITHUB_SHA}"
          docker push "${REGISTRY_NORM}/${HARBOR_PROJECT}/cruvero-mcp-gateway:dev"
