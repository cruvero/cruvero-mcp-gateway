name: Build And Push Dev Image

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  docker-build-push:
    runs-on:
      group: cruvero-org-runners
    steps:
      - uses: actions/checkout@v4

      - name: Resolve Harbor Registry
        shell: bash
        run: |
          set -euo pipefail
          registry="${{ secrets.HARBOR_URL }}"
          registry="${registry#https://}"
          registry="${registry#http://}"
          registry="${registry%/}"
          if [[ -z "${registry}" ]]; then
            echo "HARBOR_URL secret is required"
            exit 1
          fi
          echo "REGISTRY=${registry}" >> "$GITHUB_ENV"

      - name: Parse Harbor Token Credentials
        shell: bash
        run: |
          set -euo pipefail
          token="${{ secrets.HARBOR_TOKEN }}"
          if [[ "${token}" != *:* ]]; then
            echo "HARBOR_TOKEN must be in username:password format"
            exit 1
          fi
          echo "HARBOR_USERNAME=${token%%:*}" >> "$GITHUB_ENV"
          echo "HARBOR_PASSWORD=${token#*:}" >> "$GITHUB_ENV"

      - name: Login To Harbor
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.HARBOR_USERNAME }}
          password: ${{ env.HARBOR_PASSWORD }}

      - name: Build Image
        shell: bash
        run: |
          set -euo pipefail
          docker build \
            -f ./Dockerfile \
            -t "${REGISTRY}/cruvero/cruvero-mcp-gateway:dev-${GITHUB_SHA}" \
            -t "${REGISTRY}/cruvero/cruvero-mcp-gateway:dev" \
            .

      - name: Push Image
        shell: bash
        run: |
          set -euo pipefail
          docker push "${REGISTRY}/cruvero/cruvero-mcp-gateway:dev-${GITHUB_SHA}"
          docker push "${REGISTRY}/cruvero/cruvero-mcp-gateway:dev"
