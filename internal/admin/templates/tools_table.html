{{define "tools_table"}}
<table>
  <thead>
    <tr>
      <th>Tool Name</th>
      <th>Risk Level</th>
      <th>Reason</th>
      <th>Updated By</th>
      <th>Actions</th>
    </tr>
  </thead>
  <tbody>
    {{range .Tools}}
    <tr>
      <td>{{.ToolName}}</td>
      <td><span class="badge badge-{{.RiskLevel}}">{{.RiskLevel}}</span></td>
      <td>{{.Reason}}</td>
      <td>{{.UpdatedBy}}</td>
      <td><a href="/admin/tools/{{.ToolName}}">Edit</a></td>
    </tr>
    {{else}}
    <tr><td colspan="5">No tools found.</td></tr>
    {{end}}
  </tbody>
</table>
{{if gt .TotalPages 1}}
<div class="pagination">
  {{range .PageNumbers}}
  <a href="?page={{.}}&q={{$.Query | urlquery}}&risk={{$.RiskFilter | urlquery}}"
     hx-get="/admin/tools?page={{.}}" hx-target="#tools-table"
     hx-include="[name='q'],[name='risk']"
     {{if eq . $.CurrentPage}}class="page-active"{{end}}>{{.}}</a>
  {{end}}
</div>
{{end}}
{{end}}
