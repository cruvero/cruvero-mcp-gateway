<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>{{.Title}} — MCP Gateway Admin</title>
<link rel="icon" type="image/svg+xml" href="/admin/static/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="/admin/static/style.css">
<script src="https://unpkg.com/htmx.org@2.0.4" integrity="sha384-HGfztofotfshcF7+8n44JQL2oJmowVChPTg48S+jvZoztPfvwD79OC/LTtG6dMp+" crossorigin="anonymous"></script>
<script defer src="https://unpkg.com/alpinejs@3.14.8/dist/cdn.min.js" integrity="sha384-X9kJyAubVxnP0hcA+AMMs21U445qsnqhnUF8EBlEpP3a42Kh/JwWjlv2ZcvGfphb" crossorigin="anonymous"></script>
</head>
<body>
{{if .DevMode}}<div class="dev-mode-banner">Dev Mode</div>{{end}}
<aside class="sidebar">
  <div class="sidebar-header">
    <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" width="24" height="24">
      <circle cx="10" cy="4" r="3" fill="#3b82f6"/>
      <circle cx="4" cy="16" r="3" fill="currentColor" fill-opacity="0.8"/>
      <circle cx="16" cy="16" r="3" fill="currentColor" fill-opacity="0.4"/>
      <path d="M 8.5,6.5 L 5.5,13.5 M 11.5,6.5 L 14.5,13.5 M 7,16 L 13,16"
            stroke="currentColor" stroke-width="1.5" stroke-opacity="0.6"/>
    </svg>
    <span>MCP Gateway</span>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-group">
      <div class="nav-group-label">Overview</div>
      <a href="/admin/" class="nav-item{{if eq .PageTitle "Dashboard"}} nav-active{{end}}">Dashboard</a>
    </div>
    <div class="nav-group">
      <div class="nav-group-label">Management</div>
      <a href="/admin/tools" class="nav-item{{if or (eq .PageTitle "Tools") (eq .PageTitle "Edit Tool")}} nav-active{{end}}">Tools</a>
      <a href="/admin/servers" class="nav-item{{if eq .PageTitle "Servers"}} nav-active{{end}}">Servers</a>
      <a href="/admin/users" class="nav-item{{if or (eq .PageTitle "Users") (eq .PageTitle "User Detail")}} nav-active{{end}}">Users</a>
      <a href="/admin/search" class="nav-item{{if eq .PageTitle "Search"}} nav-active{{end}}">Search</a>
    </div>
    <div class="nav-group">
      <div class="nav-group-label">Monitoring</div>
      <a href="/admin/ratelimits" class="nav-item{{if eq .PageTitle "Rate Limits"}} nav-active{{end}}">Rate Limits</a>
      <a href="/admin/audit" class="nav-item{{if eq .PageTitle "Audit Log"}} nav-active{{end}}">Audit Log</a>
    </div>
  </nav>
</aside>
<div class="main-wrapper">
  <header class="topbar">
    <div class="topbar-user">{{.Email}}</div>
  </header>
  <main class="content">
{{block "content" .}}{{end}}
  </main>
</div>
</body>
</html>
