{{define "content"}}
<h1>Audit Log</h1>
<div>
  <div class="filters">
    <input type="date" name="since" class="audit-filter"
           value="{{.Since}}"
           hx-get="/admin/audit" hx-trigger="change"
           hx-target="#audit-table" hx-include=".audit-filter">
    <input type="date" name="until" class="audit-filter"
           value="{{.Until}}"
           hx-get="/admin/audit" hx-trigger="change"
           hx-target="#audit-table" hx-include=".audit-filter">
    <input type="text" name="client_id" placeholder="Client ID"
           value="{{.ClientID}}"
           class="audit-filter"
           hx-get="/admin/audit" hx-trigger="keyup changed delay:300ms"
           hx-target="#audit-table" hx-include=".audit-filter">
    <input type="text" name="username" placeholder="Username"
           value="{{.Username}}"
           class="audit-filter"
           hx-get="/admin/audit" hx-trigger="keyup changed delay:300ms"
           hx-target="#audit-table" hx-include=".audit-filter">
    <input type="text" name="tool_name" placeholder="Tool name"
           value="{{.ToolName}}"
           class="audit-filter"
           hx-get="/admin/audit" hx-trigger="keyup changed delay:300ms"
           hx-target="#audit-table" hx-include=".audit-filter">
    <input type="text" name="details" placeholder="Search details..."
           value="{{.DetailsSearch}}"
           class="audit-filter"
           hx-get="/admin/audit" hx-trigger="keyup changed delay:300ms"
           hx-target="#audit-table" hx-include=".audit-filter">
    <select name="decision" class="audit-filter"
            hx-get="/admin/audit" hx-trigger="change"
            hx-target="#audit-table" hx-include=".audit-filter">
      <option value="" {{if eq .Decision ""}}selected{{end}}>All decisions</option>
      <option value="allow" {{if eq .Decision "allow"}}selected{{end}}>Allow</option>
      <option value="deny" {{if eq .Decision "deny"}}selected{{end}}>Deny</option>
    </select>
    <input type="hidden" name="sort_by" class="audit-filter" value="{{.SortBy}}">
    <input type="hidden" name="sort_dir" class="audit-filter" value="{{.SortDir}}">
  </div>
  <div id="audit-table">
    {{template "audit_table" .}}
  </div>
</div>
{{end}}
