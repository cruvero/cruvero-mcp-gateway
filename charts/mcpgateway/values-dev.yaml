commonLabels:
  environment: dev

replicaCount: 1

autoscaling:
  enabled: false

image:
  repository: harbor.dev.gchinfo.com/cruvero/cruvero-mcp-gateway
  tag: dev
  pullPolicy: Always

imagePullSecrets:
  - name: harbor-pull-secret

tls:
  certManager:
    enabled: true
    secretName: mcpgateway-dev-tls
    issuerRef:
      name: vault-mcp-gateway-server
      kind: ClusterIssuer
      group: cert-manager.io
    dnsNames:
      - mcpgateway-dev
      - mcpgateway-dev.cruvero-dev
      - mcpgateway-dev.cruvero-dev.svc
      - mcpgateway-dev.cruvero-dev.svc.cluster.local

probes:
  scheme: HTTPS

rateLimit:
  backend: memory

config:
  MCPGW_TLS_CERT: "/tls/tls.crt"
  MCPGW_TLS_KEY: "/tls/tls.key"
  MCPGW_TLS_CA: "/tls/ca.crt"
  MCPGW_SPIFFE_ALLOW_PREFIX: "spiffe://cruvero.dev/ns/cruvero-dev/sa/"
  MCPGW_CRUVERO_ENABLED: "true"
  MCPGW_GATEWAY_ID: "mcpgateway-dev"
  MCPGW_RATE_LIMIT_BACKEND: "memory"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://mcpgateway-dev-otel-collector:4318"

vault:
  enabled: true
  createAuth: false
  authRef: default
  mount: secret
  path: cruvero
  refreshAfter: 30s

secrets:
  existingSecret: mcpgateway-dev-vault-secrets
  otlpEndpointFromSecret: false

tracing:
  enabled: true

networkPolicy:
  egress:
    otel:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: cruvero-dev
        podSelector:
          matchLabels:
            app.kubernetes.io/instance: mcpgateway-dev
            app.kubernetes.io/component: otel-collector
