commonLabels:
  environment: dev

replicaCount: 1

autoscaling:
  enabled: false

image:
  repository: harbor.dev.gchinfo.com/cruvero/cruvero-mcp-gateway
  tag: dev
  pullPolicy: Always

imagePullSecrets:
  - name: harbor-pull-secret

tls:
  secretName: cruvero-dev-tls

probes:
  scheme: HTTP

config:
  MCPGW_TLS_CERT: ""
  MCPGW_TLS_KEY: ""
  MCPGW_TLS_CA: ""
  MCPGW_CRUVERO_ENABLED: "true"
  MCPGW_GATEWAY_ID: "mcpgateway-dev"

vault:
  enabled: true
  createAuth: false
  authRef: default
  mount: secret
  path: cruvero
  refreshAfter: 30s

secrets:
  existingSecret: mcpgateway-dev-vault-secrets
