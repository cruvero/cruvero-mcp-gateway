commonLabels:
  environment: dev

replicaCount: 1

autoscaling:
  enabled: false

image:
  repository: harbor.dev.gchinfo.com/cruvero/cruvero-mcp-gateway
  tag: dev
  pullPolicy: Always

imagePullSecrets:
  - name: harbor-pull-secret

tls:
  secretName: cruvero-dev-tls

probes:
  scheme: HTTP

config:
  MCPGW_TLS_CERT: ""
  MCPGW_TLS_KEY: ""
  MCPGW_TLS_CA: ""
  MCPGW_CRUVERO_ENABLED: "true"
  MCPGW_GATEWAY_ID: "mcpgateway-dev"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://mcpgateway-dev-otel-collector:4318"

vault:
  enabled: true
  createAuth: false
  authRef: default
  mount: secret
  path: cruvero
  refreshAfter: 30s

secrets:
  existingSecret: mcpgateway-dev-vault-secrets
  otlpEndpointFromSecret: false

tracing:
  enabled: true

networkPolicy:
  egress:
    otel:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: cruvero-dev
        podSelector:
          matchLabels:
            app.kubernetes.io/instance: mcpgateway-dev
            app.kubernetes.io/component: otel-collector
