commonLabels:
  environment: dev

replicaCount: 1

autoscaling:
  enabled: false

image:
  repository: registry.example.com/<PROJECT>/<IMAGE>
  tag: dev
  pullPolicy: Always

imagePullSecrets:
  - name: <PULL_SECRET>

tls:
  certManager:
    enabled: true
    secretName: mcpgateway-dev-tls
    issuerRef:
      name: <CERT_ISSUER>
      kind: ClusterIssuer
      group: cert-manager.io
    dnsNames:
      - mcpgateway-dev
      - mcpgateway-dev.<APP>-dev
      - mcpgateway-dev.<APP>-dev.svc
      - mcpgateway-dev.<APP>-dev.svc.cluster.local

service:
  annotations:
    traefik.ingress.kubernetes.io/service.serversscheme: https
    traefik.ingress.kubernetes.io/service.serverstransport: <APP>-dev-mcpgateway-dev@kubernetescrd

probes:
  scheme: HTTPS

rateLimit:
  backend: memory

config:
  MCPGW_TLS_CERT: "/tls/tls.crt"
  MCPGW_TLS_KEY: "/tls/tls.key"
  MCPGW_TLS_CA: "/tls/ca.crt"
  MCPGW_SPIFFE_ALLOW_PREFIX: "spiffe://<TRUST_DOMAIN>/ns/<APP>-dev/sa/"
  MCPGW_CRUVERO_ENABLED: "true"
  MCPGW_GATEWAY_ID: "mcpgateway-dev"
  MCPGW_RATE_LIMIT_BACKEND: "memory"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://mcpgateway-dev-otel-collector:4318"

vault:
  enabled: true
  createAuth: false
  authRef: <VAULT_AUTH>
  mount: secret
  path: <VAULT_PATH>
  refreshAfter: 30s

secrets:
  existingSecret: mcpgateway-dev-vault-secrets
  otlpEndpointFromSecret: false

admin:
  enabled: true
  externalURL: https://gateway.example.com
  oidc:
    clientID: mcpgateway-admin
  requiredScope: admin
  sessionTTL: 8h

tracing:
  enabled: true

# Ingress: exposes admin dashboard at gateway.example.com
# OIDC redirect URI: https://gateway.example.com/admin/callback
ingress:
  enabled: true
  className: traefik
  host: gateway.example.com
  tls: true
  tlsSecretName: mcpgateway-dev-ingress-tls
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    cert-manager.io/cluster-issuer: letsencrypt-dns01

networkPolicy:
  ingress:
    sources:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: traefik
        podSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
  egress:
    oidc:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: traefik
        podSelector:
          matchLabels:
            app.kubernetes.io/name: traefik
    otel:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: <APP>-dev
        podSelector:
          matchLabels:
            app.kubernetes.io/instance: mcpgateway-dev
            app.kubernetes.io/component: otel-collector
