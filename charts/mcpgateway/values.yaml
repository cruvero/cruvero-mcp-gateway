# -- Optional chart name override.
nameOverride: ""
# -- Optional full resource name override.
fullnameOverride: ""
# -- Additional labels to apply to all chart-managed resources.
commonLabels: {}

replicaCount: 2

image:
  # -- Container image repository.
  repository: ghcr.io/cruvero/mcp-gateway
  # -- Container image tag. Defaults to Chart appVersion when empty.
  tag: ""
  # -- Kubernetes image pull policy.
  pullPolicy: IfNotPresent

imagePullSecrets: []

serviceAccount:
  # -- Create a dedicated ServiceAccount for the gateway workload.
  create: true
  # -- Optional ServiceAccount name override.
  name: ""
  # -- Optional annotations for IRSA/workload identity integrations.
  annotations: {}

service:
  # -- Kubernetes Service type.
  type: ClusterIP
  ports:
    https: 8443
    metrics: 9090
  # -- Additional annotations for the Service (e.g. Traefik backend TLS).
  annotations: {}

probes:
  # -- Probe scheme used for /healthz and /readyz checks.
  scheme: HTTPS

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  # -- Target average CPU utilization percentage.
  targetCPU: 70

# Runtime configuration exported to MCPGW_* environment variables.
config:
  MCPGW_LISTEN_ADDR: ":8443"
  MCPGW_TLS_CERT: "/tls/tls.crt"
  MCPGW_TLS_KEY: "/tls/tls.key"
  MCPGW_TLS_CA: "/tls/ca.crt"
  MCPGW_NATS_URL: ""
  MCPGW_OIDC_ISSUER: ""
  MCPGW_OIDC_AUDIENCE: ""
  MCPGW_HEARTBEAT_TTL: "30s"
  MCPGW_RATE_DEFAULT: "10"
  MCPGW_RATE_BURST: "20"
  MCPGW_CIRCUIT_THRESHOLD: "5"
  MCPGW_CIRCUIT_TIMEOUT: "30s"
  MCPGW_RETRY_MAX: "3"
  MCPGW_SPIFFE_ALLOW_PREFIX: ""
  MCPGW_LOG_FORMAT: "json"
  MCPGW_LOG_LEVEL: "info"
  MCPGW_METRICS_ADDR: ":9090"
  MCPGW_CRUVERO_ENABLED: "false"
  MCPGW_GATEWAY_ID: "auto"
  MCPGW_ADMIN_MODE: "standalone"
  MCPGW_CORS_ENABLED: "false"
  MCPGW_RATE_LIMIT_BACKEND: "memory"
  MCPGW_PROGRESSIVE_DISCOVERY: "true"
  # -- Comma-separated SPIFFE ID prefixes for platform catalog mTLS access.
  MCPGW_PLATFORM_SPIFFE_PREFIXES: ""
  # -- Search engine type: substring, bm25, vector, or hybrid.
  MCPGW_SEARCH_ENGINE: ""
  # -- Path to ONNX Runtime shared library (used by vector/hybrid search).
  MCPGW_ONNX_RUNTIME_PATH: "/usr/lib/libonnxruntime.so"
  # -- Path to the ONNX model file (all-MiniLM-L6-v2).
  MCPGW_ONNX_MODEL_PATH: "/models/all-MiniLM-L6-v2.onnx"
  # -- Path to the HuggingFace tokenizer.json for the embedding model.
  MCPGW_TOKENIZER_PATH: "/models/tokenizer.json"
  # OTel variables consumed by internal/config.
  OTEL_EXPORTER_OTLP_ENDPOINT: ""
  OTEL_SERVICE_NAME: "mcpgw"

# TLS serving certificate configuration.
tls:
  enabled: true
  # -- Existing secret that contains tls.crt/tls.key (used when certManager.enabled=false).
  secretName: "mcpgw-tls"
  certManager:
    enabled: false
    # -- TLS secret name created by cert-manager.
    secretName: ""
    issuerRef:
      name: ""
      kind: ClusterIssuer
      group: cert-manager.io
    dnsNames: []

nats:
  # -- Enable NATS integration mode.
  enabled: false
  # -- NATS server URL; use valueFrom secret for production deployments.
  url: ""
  tls:
    # -- Enable mTLS for NATS connections.
    enabled: false
    # -- Name of the Kubernetes Secret containing the NATS client cert and key.
    certSecretName: ""
    # -- Name of the Kubernetes Secret containing the NATS CA certificate.
    caSecretName: ""

rateLimit:
  # -- Rate limit backend: memory (default), dragonfly, or nats.
  backend: memory

deviceFlow:
  # -- Enable OAuth2 Device Code flow for IDE/CLI authentication.
  enabled: false
  # -- IdP device authorization endpoint URL.
  idpDeviceURL: ""
  # -- IdP token endpoint URL.
  idpTokenURL: ""
  # -- OAuth2 client ID for device flow.
  clientID: ""
  # clientSecret: via Vault secret (never in values.yaml)

admin:
  # -- Enable the admin dashboard.
  enabled: false
  # -- External base URL for OIDC redirect (e.g. https://gateway.example.com).
  externalURL: ""
  oidc:
    # -- OIDC client ID for admin dashboard authentication.
    clientID: ""
  # -- Required OIDC scope for admin access.
  requiredScope: admin
  # -- Admin session duration.
  sessionTTL: 8h
  # clientSecret + sessionKey: via secretKeyRef (never in values.yaml)

dragonfly:
  # -- Enable DragonflyDB for distributed rate limiting.
  enabled: false
  # -- DragonflyDB connection URL (set via secret for production).
  url: ""

orchestrate:
  # -- Enable the cruvero.orchestrate meta-tool (LLM-driven tool planning/execution).
  enabled: false
  # -- Ordered list of LLM providers for failover. Lower priority = tried first.
  # API keys must be stored in the runtime secret as MCPGW_LLM_{UPPER(name)}_API_KEY.
  providers: []
  # Example:
  #   - name: openai
  #     model: gpt-4o-mini
  #     priority: 1
  #   - name: xai
  #     model: grok-3-mini
  #     base_url: https://api.x.ai/v1
  #     priority: 10

ingress:
  # -- Enable an Ingress resource for external access.
  enabled: false
  # -- Ingress class name (e.g. nginx, traefik).
  className: ""
  # -- Hostname for the Ingress rule.
  host: gateway.example.com
  # -- Enable TLS termination on the Ingress.
  tls: true
  # -- Existing TLS secret name for the Ingress; leave empty for default.
  tlsSecretName: ""
  # -- Additional Ingress annotations (e.g. cert-manager, CORS).
  annotations: {}

database:
  # -- Logical reference for DB URL source. Actual value must come from existingSecret.
  url: "existing-secret-ref"
  autoMigrate:
    # -- Run `mcpgw migrate --direction up` before starting each pod.
    enabled: true

# Vault Secrets Operator integration contract.
vault:
  enabled: false
  createAuth: false
  authRef: ""
  mount: ""
  path: ""
  refreshAfter: 1m

secrets:
  # -- Existing Kubernetes Secret name with runtime credentials/settings.
  existingSecret: "mcpgw-runtime"
  # -- When true, OTEL_EXPORTER_OTLP_ENDPOINT is sourced from runtime secret.
  # Set false to source it from config.OTEL_EXPORTER_OTLP_ENDPOINT instead.
  otlpEndpointFromSecret: true
  # -- Secret key names used for env wiring.
  keys:
    dbURL: MCPGW_DB_URL
    natsURL: MCPGW_NATS_URL
    oidcIssuer: MCPGW_OIDC_ISSUER
    oidcAudience: MCPGW_OIDC_AUDIENCE
    platformServiceToken: MCPGW_PLATFORM_SERVICE_TOKEN
    otlpEndpoint: OTEL_EXPORTER_OTLP_ENDPOINT

monitoring:
  serviceMonitor:
    enabled: false
    interval: 15s
    labels: {}
  prometheusRule:
    enabled: false
    labels: {}

tracing:
  # -- Deploy in-cluster OTel Collector that forwards traces to an external Tempo instance.
  enabled: false
  collector:
    # -- OTLP HTTP endpoint of the Tempo instance that receives traces. Required when tracing.enabled=true.
    tempoEndpoint: ""
    image:
      repository: otel/opentelemetry-collector-contrib
      tag: "0.146.1"
      pullPolicy: IfNotPresent
    service:
      otlpHttpPort: 4318
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi

networkPolicy:
  enabled: true
  ingress:
    # -- Allowed sources for HTTPS ingress (port 8443).
    sources:
      - namespaceSelector: {}
        podSelector: {}
    # -- Allowed namespaces for metrics scraping ingress (port 9090).
    metricsNamespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: monitoring
  egress:
    # -- Allowed Postgres destinations (port 5432).
    postgres:
      - namespaceSelector: {}
        podSelector: {}
    # -- Allowed NATS destinations (port 4222).
    nats:
      - namespaceSelector: {}
        podSelector: {}
    # -- Allowed backend MCP server destinations (port 8443 by default).
    backends:
      - namespaceSelector: {}
        podSelector: {}
    # -- Allowed OIDC provider destinations (ports 443/80).
    oidc: []
    # -- Allowed LLM API provider destinations (port 443, e.g. api.openai.com).
    llm: []
    # -- Allowed OTLP collector destinations (port 4318).
    otel: []
    # -- DNS egress destinations (UDP/TCP 53).
    dns:
      - namespaceSelector:
          matchLabels:
            kubernetes.io/metadata.name: kube-system
        podSelector:
          matchLabels:
            k8s-app: kube-dns
