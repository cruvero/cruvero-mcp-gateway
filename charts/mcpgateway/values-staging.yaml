commonLabels:
  environment: staging

replicaCount: 2

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 5

image:
  repository: registry.example.com/<PROJECT>/<IMAGE>
  tag: staging-latest
  pullPolicy: Always

imagePullSecrets:
  - name: <PULL_SECRET>

tls:
  certManager:
    enabled: true
    secretName: mcpgateway-staging-tls
    issuerRef:
      name: <CERT_ISSUER>
      kind: ClusterIssuer
      group: cert-manager.io
    dnsNames:
      - mcpgateway-staging
      - mcpgateway-staging.<APP>-staging
      - mcpgateway-staging.<APP>-staging.svc
      - mcpgateway-staging.<APP>-staging.svc.cluster.local

probes:
  scheme: HTTPS

config:
  MCPGW_TLS_CERT: "/tls/tls.crt"
  MCPGW_TLS_KEY: "/tls/tls.key"
  MCPGW_TLS_CA: "/tls/ca.crt"
  MCPGW_SPIFFE_ALLOW_PREFIX: "spiffe://<TRUST_DOMAIN>/ns/<APP>-staging/sa/"
  MCPGW_CRUVERO_ENABLED: "true"
  MCPGW_GATEWAY_ID: "mcpgateway-staging"
  MCPGW_RATE_LIMIT_BACKEND: "memory"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://mcpgateway-staging-otel-collector:4318"

vault:
  enabled: true
  createAuth: true
  authRef: <VAULT_AUTH>
  mount: kubernetes
  path: <VAULT_PATH>
  refreshAfter: 1m

secrets:
  existingSecret: mcpgw-runtime-staging

tracing:
  enabled: true

monitoring:
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
