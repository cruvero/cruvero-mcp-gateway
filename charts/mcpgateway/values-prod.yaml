commonLabels:
  environment: prod

replicaCount: 3

autoscaling:
  minReplicas: 3
  maxReplicas: 20

config:
  MCPGW_CRUVERO_ENABLED: "true"
  MCPGW_RATE_LIMIT_BACKEND: "dragonfly"

rateLimit:
  backend: dragonfly

dragonfly:
  enabled: true
  url: "redis://dragonfly:6379"

vault:
  enabled: true
  createAuth: true
  authRef: mcpgw-vault-auth-prod
  mount: kubernetes
  path: secret/data/mcpgateway/prod/runtime
  refreshAfter: 1m

secrets:
  existingSecret: mcpgw-runtime-prod

monitoring:
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
