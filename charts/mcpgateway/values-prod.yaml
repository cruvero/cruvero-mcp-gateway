commonLabels:
  environment: prod

replicaCount: 3

autoscaling:
  minReplicas: 3
  maxReplicas: 20

image:
  repository: harbor.dev.gchinfo.com/cruvero/cruvero-mcp-gateway
  tag: v1.0.0
  pullPolicy: IfNotPresent

imagePullSecrets:
  - name: harbor-pull-secret

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    cpu: "1"
    memory: 1Gi

tls:
  certManager:
    enabled: true
    secretName: mcpgateway-prod-tls
    issuerRef:
      name: vault-mcp-gateway-server
      kind: ClusterIssuer
      group: cert-manager.io
    dnsNames:
      - mcpgateway-prod
      - mcpgateway-prod.cruvero-prod
      - mcpgateway-prod.cruvero-prod.svc
      - mcpgateway-prod.cruvero-prod.svc.cluster.local

probes:
  scheme: HTTPS

config:
  MCPGW_TLS_CERT: "/tls/tls.crt"
  MCPGW_TLS_KEY: "/tls/tls.key"
  MCPGW_TLS_CA: "/tls/ca.crt"
  MCPGW_SPIFFE_ALLOW_PREFIX: "spiffe://cruvero.dev/ns/cruvero-prod/sa/"
  MCPGW_CRUVERO_ENABLED: "true"
  MCPGW_GATEWAY_ID: "mcpgateway-prod"
  MCPGW_RATE_LIMIT_BACKEND: "dragonfly"
  MCPGW_NATS_TLS_ENABLED: "true"
  OTEL_EXPORTER_OTLP_ENDPOINT: "http://mcpgateway-prod-otel-collector:4318"

rateLimit:
  backend: dragonfly

dragonfly:
  enabled: true
  url: "redis://dragonfly:6379"

vault:
  enabled: true
  createAuth: true
  authRef: mcpgw-vault-auth-prod
  mount: kubernetes
  path: secret/data/mcpgateway/prod/runtime
  refreshAfter: 1m

secrets:
  existingSecret: mcpgw-runtime-prod

tracing:
  enabled: true

monitoring:
  serviceMonitor:
    enabled: true
  prometheusRule:
    enabled: true
