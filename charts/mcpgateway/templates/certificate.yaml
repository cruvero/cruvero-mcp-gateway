{{- if and .Values.tls.enabled .Values.tls.certManager.enabled }}
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ include "mcpgateway.fullname" . }}
  annotations:
    argocd.argoproj.io/compare-options: IgnoreExtraneous
  labels:
    {{- include "mcpgateway.labels" . | nindent 4 }}
spec:
  secretName: {{ required "tls.certManager.secretName is required when certManager is enabled" .Values.tls.certManager.secretName | quote }}
  issuerRef:
    name: {{ required "tls.certManager.issuerRef.name is required when certManager is enabled" .Values.tls.certManager.issuerRef.name | quote }}
    kind: {{ .Values.tls.certManager.issuerRef.kind | quote }}
    group: {{ .Values.tls.certManager.issuerRef.group | quote }}
  renewBefore: 360h
  dnsNames:
    {{- toYaml .Values.tls.certManager.dnsNames | nindent 4 }}
{{- end }}
