apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcpgateway.configMapName" . }}
  labels:
    {{- include "mcpgateway.labels" . | nindent 4 }}
data:
  MCPGW_LISTEN_ADDR: {{ .Values.config.MCPGW_LISTEN_ADDR | quote }}
  MCPGW_TLS_CERT: {{ .Values.config.MCPGW_TLS_CERT | quote }}
  MCPGW_TLS_KEY: {{ .Values.config.MCPGW_TLS_KEY | quote }}
  MCPGW_TLS_CA: {{ .Values.config.MCPGW_TLS_CA | quote }}
  MCPGW_HEARTBEAT_TTL: {{ .Values.config.MCPGW_HEARTBEAT_TTL | quote }}
  MCPGW_RATE_DEFAULT: {{ .Values.config.MCPGW_RATE_DEFAULT | quote }}
  MCPGW_RATE_BURST: {{ .Values.config.MCPGW_RATE_BURST | quote }}
  MCPGW_CIRCUIT_THRESHOLD: {{ .Values.config.MCPGW_CIRCUIT_THRESHOLD | quote }}
  MCPGW_CIRCUIT_TIMEOUT: {{ .Values.config.MCPGW_CIRCUIT_TIMEOUT | quote }}
  MCPGW_RETRY_MAX: {{ .Values.config.MCPGW_RETRY_MAX | quote }}
  MCPGW_SPIFFE_ALLOW_PREFIX: {{ .Values.config.MCPGW_SPIFFE_ALLOW_PREFIX | quote }}
  MCPGW_LOG_FORMAT: {{ .Values.config.MCPGW_LOG_FORMAT | quote }}
  MCPGW_LOG_LEVEL: {{ .Values.config.MCPGW_LOG_LEVEL | quote }}
  MCPGW_METRICS_ADDR: {{ .Values.config.MCPGW_METRICS_ADDR | quote }}
  MCPGW_CRUVERO_ENABLED: {{ .Values.config.MCPGW_CRUVERO_ENABLED | quote }}
  MCPGW_GATEWAY_ID: {{ .Values.config.MCPGW_GATEWAY_ID | quote }}
  MCPGW_ADMIN_MODE: {{ .Values.config.MCPGW_ADMIN_MODE | quote }}
  MCPGW_CORS_ENABLED: {{ .Values.config.MCPGW_CORS_ENABLED | quote }}
  MCPGW_RATE_LIMIT_BACKEND: {{ .Values.config.MCPGW_RATE_LIMIT_BACKEND | quote }}
  MCPGW_PROGRESSIVE_DISCOVERY: {{ .Values.config.MCPGW_PROGRESSIVE_DISCOVERY | quote }}
  {{- if .Values.admin.enabled }}
  MCPGW_ADMIN_ENABLED: "true"
  MCPGW_ADMIN_OIDC_CLIENT_ID: {{ .Values.admin.oidc.clientID | quote }}
  MCPGW_ADMIN_REQUIRED_SCOPE: {{ .Values.admin.requiredScope | quote }}
  MCPGW_ADMIN_SESSION_TTL: {{ .Values.admin.sessionTTL | quote }}
  {{- if .Values.admin.externalURL }}
  MCPGW_ADMIN_EXTERNAL_URL: {{ .Values.admin.externalURL | quote }}
  {{- end }}
  {{- end }}
  {{- if .Values.deviceFlow.enabled }}
  MCPGW_DEVICE_FLOW_ENABLED: "true"
  MCPGW_DEVICE_FLOW_IDP_DEVICE_URL: {{ .Values.deviceFlow.idpDeviceURL | quote }}
  MCPGW_DEVICE_FLOW_IDP_TOKEN_URL: {{ .Values.deviceFlow.idpTokenURL | quote }}
  MCPGW_DEVICE_FLOW_CLIENT_ID: {{ .Values.deviceFlow.clientID | quote }}
  {{- end }}
  {{- if .Values.dragonfly.enabled }}
  MCPGW_DRAGONFLY_URL: {{ .Values.dragonfly.url | quote }}
  {{- end }}
  {{- if .Values.config.MCPGW_PLATFORM_SPIFFE_PREFIXES }}
  MCPGW_PLATFORM_SPIFFE_PREFIXES: {{ .Values.config.MCPGW_PLATFORM_SPIFFE_PREFIXES | quote }}
  {{- end }}
  {{- if .Values.config.MCPGW_SEARCH_ENGINE }}
  MCPGW_SEARCH_ENGINE: {{ .Values.config.MCPGW_SEARCH_ENGINE | quote }}
  {{- end }}
  {{- if .Values.config.MCPGW_ONNX_RUNTIME_PATH }}
  MCPGW_ONNX_RUNTIME_PATH: {{ .Values.config.MCPGW_ONNX_RUNTIME_PATH | quote }}
  {{- end }}
  {{- if .Values.config.MCPGW_ONNX_MODEL_PATH }}
  MCPGW_ONNX_MODEL_PATH: {{ .Values.config.MCPGW_ONNX_MODEL_PATH | quote }}
  {{- end }}
  {{- if .Values.config.MCPGW_TOKENIZER_PATH }}
  MCPGW_TOKENIZER_PATH: {{ .Values.config.MCPGW_TOKENIZER_PATH | quote }}
  {{- end }}
  {{- if .Values.orchestrate.enabled }}
  MCPGW_ORCHESTRATE_ENABLED: "true"
  {{- if .Values.orchestrate.providers }}
  MCPGW_LLM_PROVIDERS: {{ .Values.orchestrate.providers | toJson | quote }}
  {{- end }}
  {{- end }}
  OTEL_EXPORTER_OTLP_ENDPOINT: {{ .Values.config.OTEL_EXPORTER_OTLP_ENDPOINT | quote }}
  OTEL_SERVICE_NAME: {{ .Values.config.OTEL_SERVICE_NAME | quote }}
