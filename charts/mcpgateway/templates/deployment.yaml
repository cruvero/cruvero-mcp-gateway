apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcpgateway.fullname" . }}
  labels:
    {{- include "mcpgateway.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "mcpgateway.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcpgateway.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "mcpgateway.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcpgw
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: https
              containerPort: {{ .Values.service.ports.https }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.service.ports.metrics }}
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "mcpgateway.configMapName" . }}
          env:
            {{- include "mcpgateway.runtimeSecretEnv" . | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: https
              scheme: {{ .Values.probes.scheme | default "HTTPS" }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: https
              scheme: {{ .Values.probes.scheme | default "HTTPS" }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.tls.enabled }}
            - name: tls-certs
              mountPath: /tls
              readOnly: true
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.tls.enabled }}
        - name: tls-certs
          secret:
            secretName: {{ include "mcpgateway.tlsSecretName" . }}
        {{- end }}
