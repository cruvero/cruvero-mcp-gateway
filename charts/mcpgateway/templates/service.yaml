apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcpgateway.fullname" . }}
  labels:
    {{- include "mcpgateway.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "mcpgateway.selectorLabels" . | nindent 4 }}
  ports:
    - name: https
      port: {{ .Values.service.ports.https }}
      targetPort: https
      protocol: TCP
    - name: metrics
      port: {{ .Values.service.ports.metrics }}
      targetPort: metrics
      protocol: TCP
