{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "mcpgateway.fullname" . }}
  labels:
    {{- include "mcpgateway.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "mcpgateway.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- range .Values.networkPolicy.ingress.sources }}
        - {{- if hasKey . "namespaceSelector" }}
          namespaceSelector:
            {{- toYaml .namespaceSelector | nindent 12 }}
          {{- end }}
          {{- if hasKey . "podSelector" }}
          podSelector:
            {{- toYaml .podSelector | nindent 12 }}
          {{- end }}
          {{- if hasKey . "ipBlock" }}
          ipBlock:
            {{- toYaml .ipBlock | nindent 12 }}
          {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8443
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.ingress.metricsNamespaceSelector | nindent 12 }}
      ports:
        - protocol: TCP
          port: 9090
  egress:
    - to:
        {{- range .Values.networkPolicy.egress.postgres }}
        - {{- if hasKey . "namespaceSelector" }}
          namespaceSelector:
            {{- toYaml .namespaceSelector | nindent 12 }}
          {{- end }}
          {{- if hasKey . "podSelector" }}
          podSelector:
            {{- toYaml .podSelector | nindent 12 }}
          {{- end }}
          {{- if hasKey . "ipBlock" }}
          ipBlock:
            {{- toYaml .ipBlock | nindent 12 }}
          {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 5432
    - to:
        {{- range .Values.networkPolicy.egress.nats }}
        - {{- if hasKey . "namespaceSelector" }}
          namespaceSelector:
            {{- toYaml .namespaceSelector | nindent 12 }}
          {{- end }}
          {{- if hasKey . "podSelector" }}
          podSelector:
            {{- toYaml .podSelector | nindent 12 }}
          {{- end }}
          {{- if hasKey . "ipBlock" }}
          ipBlock:
            {{- toYaml .ipBlock | nindent 12 }}
          {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 4222
    - to:
        {{- range .Values.networkPolicy.egress.backends }}
        - {{- if hasKey . "namespaceSelector" }}
          namespaceSelector:
            {{- toYaml .namespaceSelector | nindent 12 }}
          {{- end }}
          {{- if hasKey . "podSelector" }}
          podSelector:
            {{- toYaml .podSelector | nindent 12 }}
          {{- end }}
          {{- if hasKey . "ipBlock" }}
          ipBlock:
            {{- toYaml .ipBlock | nindent 12 }}
          {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8443
    {{- if .Values.networkPolicy.egress.otel }}
    - to:
        {{- range .Values.networkPolicy.egress.otel }}
        - {{- if hasKey . "namespaceSelector" }}
          namespaceSelector:
            {{- toYaml .namespaceSelector | nindent 12 }}
          {{- end }}
          {{- if hasKey . "podSelector" }}
          podSelector:
            {{- toYaml .podSelector | nindent 12 }}
          {{- end }}
          {{- if hasKey . "ipBlock" }}
          ipBlock:
            {{- toYaml .ipBlock | nindent 12 }}
          {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: 4318
    {{- end }}
    - to:
        {{- range .Values.networkPolicy.egress.dns }}
        - {{- if hasKey . "namespaceSelector" }}
          namespaceSelector:
            {{- toYaml .namespaceSelector | nindent 12 }}
          {{- end }}
          {{- if hasKey . "podSelector" }}
          podSelector:
            {{- toYaml .podSelector | nindent 12 }}
          {{- end }}
          {{- if hasKey . "ipBlock" }}
          ipBlock:
            {{- toYaml .ipBlock | nindent 12 }}
          {{- end }}
        {{- end }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
