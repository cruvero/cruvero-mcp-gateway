{{- if and (not .Values.vault.enabled) (empty .Values.secrets.existingSecret) -}}
{{- fail "secrets.existingSecret must be set when vault.enabled=false" -}}
{{- end -}}
{{- if and .Values.vault.enabled (empty .Values.secrets.existingSecret) -}}
{{- fail "secrets.existingSecret must be set when vault.enabled=true (VaultStaticSecret destination)" -}}
{{- end -}}
{{- if and .Values.vault.enabled (empty .Values.vault.authRef) -}}
{{- fail "vault.authRef must be set when vault.enabled=true" -}}
{{- end -}}
{{- if and .Values.vault.enabled (empty .Values.vault.mount) -}}
{{- fail "vault.mount must be set when vault.enabled=true" -}}
{{- end -}}
{{- if and .Values.vault.enabled (empty .Values.vault.path) -}}
{{- fail "vault.path must be set when vault.enabled=true" -}}
{{- end -}}
