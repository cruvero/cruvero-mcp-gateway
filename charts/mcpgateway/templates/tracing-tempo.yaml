{{- if .Values.tracing.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcpgateway.fullname" . }}-tempo
  labels:
    {{- include "mcpgateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
data:
  tempo.yaml: |
    server:
      http_listen_port: {{ .Values.tracing.tempo.service.httpPort }}

    distributor:
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:{{ .Values.tracing.tempo.service.otlpHttpPort }}

    ingester:
      max_block_duration: 5m

    compactor:
      compaction:
        block_retention: {{ .Values.tracing.tempo.retention }}

    storage:
      trace:
        backend: local
        wal:
          path: /var/tempo/wal
        local:
          path: /var/tempo/blocks
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcpgateway.fullname" . }}-tempo
  labels:
    {{- include "mcpgateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.tracing.tempo.service.httpPort }}
      targetPort: http
      protocol: TCP
    - name: otlp-http
      port: {{ .Values.tracing.tempo.service.otlpHttpPort }}
      targetPort: otlp-http
      protocol: TCP
  selector:
    app.kubernetes.io/name: {{ include "mcpgateway.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: tempo
{{- if .Values.tracing.tempo.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "mcpgateway.fullname" . }}-tempo
  labels:
    {{- include "mcpgateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.tracing.tempo.persistence.size }}
  {{- with .Values.tracing.tempo.persistence.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcpgateway.fullname" . }}-tempo
  labels:
    {{- include "mcpgateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "mcpgateway.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: tempo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "mcpgateway.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: tempo
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: tempo
          image: "{{ .Values.tracing.tempo.image.repository }}:{{ .Values.tracing.tempo.image.tag }}"
          imagePullPolicy: {{ .Values.tracing.tempo.image.pullPolicy }}
          args:
            - -target=all
            - -config.file=/etc/tempo/tempo.yaml
          ports:
            - name: http
              containerPort: {{ .Values.tracing.tempo.service.httpPort }}
              protocol: TCP
            - name: otlp-http
              containerPort: {{ .Values.tracing.tempo.service.otlpHttpPort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.tracing.tempo.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tempo-config
              mountPath: /etc/tempo
              readOnly: true
            - name: tempo-data
              mountPath: /var/tempo
      securityContext:
        fsGroup: 10001
      volumes:
        - name: tempo-config
          configMap:
            name: {{ include "mcpgateway.fullname" . }}-tempo
        - name: tempo-data
          {{- if .Values.tracing.tempo.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "mcpgateway.fullname" . }}-tempo
          {{- else }}
          emptyDir: {}
          {{- end }}
{{- end }}
