{{- if .Values.tracing.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "mcpgateway.fullname" . }}-otel-collector
  labels:
    {{- include "mcpgateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
data:
  otel-collector.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:{{ .Values.tracing.collector.service.otlpHttpPort }}

    processors:
      batch: {}

    exporters:
      otlp_http/tempo:
        endpoint: "{{ required "tracing.collector.tempoEndpoint is required when tracing is enabled" .Values.tracing.collector.tempoEndpoint }}"

    extensions:
      health_check:
        endpoint: 0.0.0.0:13133

    service:
      extensions: [health_check]
      pipelines:
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlp_http/tempo]
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "mcpgateway.fullname" . }}-otel-collector
  labels:
    {{- include "mcpgateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  type: ClusterIP
  ports:
    - name: otlp-http
      port: {{ .Values.tracing.collector.service.otlpHttpPort }}
      targetPort: otlp-http
      protocol: TCP
  selector:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: otel-collector
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "mcpgateway.fullname" . }}-otel-collector
  labels:
    {{- include "mcpgateway.labels" . | nindent 4 }}
    app.kubernetes.io/component: otel-collector
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: otel-collector
  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/component: otel-collector
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: otel-collector
          image: "{{ .Values.tracing.collector.image.repository }}:{{ .Values.tracing.collector.image.tag }}"
          imagePullPolicy: {{ .Values.tracing.collector.image.pullPolicy }}
          args:
            - --config=/etc/otel-collector/otel-collector.yaml
          ports:
            - name: otlp-http
              containerPort: {{ .Values.tracing.collector.service.otlpHttpPort }}
              protocol: TCP
            - name: health
              containerPort: 13133
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.tracing.collector.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: collector-config
              mountPath: /etc/otel-collector
              readOnly: true
      volumes:
        - name: collector-config
          configMap:
            name: {{ include "mcpgateway.fullname" . }}-otel-collector
{{- end }}
