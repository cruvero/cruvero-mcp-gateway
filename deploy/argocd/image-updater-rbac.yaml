apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: argocd-image-updater-pull-secret
  namespace: <NAMESPACE>
  labels:
    app.kubernetes.io/component: argocd-image-updater-controller
    app.kubernetes.io/part-of: argocd-image-updater
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: ["<PULL_SECRET>"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: argocd-image-updater-pull-secret
  namespace: <NAMESPACE>
  labels:
    app.kubernetes.io/component: argocd-image-updater-controller
    app.kubernetes.io/part-of: argocd-image-updater
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: argocd-image-updater-pull-secret
subjects:
  - kind: ServiceAccount
    name: argocd-image-updater-controller
    namespace: argocd
