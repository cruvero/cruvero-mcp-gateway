apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mcpgateway
  namespace: argocd
spec:
  description: GitOps boundaries for dev deployment of cruvero-mcp-gateway.
  sourceRepos:
    - https://github.com/cruvero/cruvero-mcp-gateway.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: cruvero-dev
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: cert-manager.io
      kind: Certificate
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: monitoring.coreos.com
      kind: PrometheusRule
    - group: secrets.hashicorp.com
      kind: VaultAuth
    - group: secrets.hashicorp.com
      kind: VaultStaticSecret
  orphanedResources:
    warn: true
    ignore:
      - group: ""
        kind: ConfigMap
        name: kube-root-ca.crt
      - group: ""
        kind: ServiceAccount
        name: default
      - group: ""
        kind: Secret
        name: mcpgateway-dev*
      - group: ""
        kind: ServiceAccount
        name: vault-secrets-operator
      - group: ""
        kind: PersistentVolumeClaim
        name: cruvero-dev-*
      - group: ""
        kind: PersistentVolumeClaim
        name: data-cruvero-dev-*
      - group: ""
        kind: PersistentVolumeClaim
        name: qdrant-storage-*
      - group: ""
        kind: PersistentVolumeClaim
        name: redis-data-cruvero-dev-*
      - group: ""
        kind: PersistentVolumeClaim
        name: storage-cruvero-dev-*
      - group: secrets.hashicorp.com
        kind: VaultAuth
        name: default
      - group: secrets.hashicorp.com
        kind: VaultStaticSecret
        name: cruvero-dev-postgresql-auth
