apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mcpgateway
  namespace: argocd
spec:
  description: GitOps boundaries for dev deployment of cruvero-mcp-gateway.
  sourceRepos:
    - https://github.com/cruvero/cruvero-mcp-gateway.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: cruvero-dev
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: apps
      kind: Deployment
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: cert-manager.io
      kind: Certificate
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: monitoring.coreos.com
      kind: PrometheusRule
    - group: secrets.hashicorp.com
      kind: VaultAuth
    - group: secrets.hashicorp.com
      kind: VaultStaticSecret
  orphanedResources:
    warn: true
    ignore:
      - group: ""
        kind: Secret
        name: mcpgateway-dev*
