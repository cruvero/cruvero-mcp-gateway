apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mcpgateway
  namespace: argocd
spec:
  description: GitOps boundaries and rollout gates for cruvero-mcp-gateway.
  sourceRepos:
    - git@github.com:cruvero/cruvero-mcp-gateway.git
    - https://github.com/cruvero/cruvero-mcp-gateway.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: mcpgateway-dev
    - server: https://kubernetes.default.svc
      namespace: mcpgateway-staging
    - server: https://kubernetes.default.svc
      namespace: mcpgateway-prod
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: apps
      kind: Deployment
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: cert-manager.io
      kind: Certificate
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: monitoring.coreos.com
      kind: PrometheusRule
    - group: secrets.hashicorp.com
      kind: VaultAuth
    - group: secrets.hashicorp.com
      kind: VaultStaticSecret
  orphanedResources:
    warn: true
    ignore:
      - group: ""
        kind: Secret
        name: mcpgw-runtime*
  syncWindows:
    - kind: deny
      schedule: "* * * * *"
      duration: 24h
      applications:
        - mcpgateway-staging
      manualSync: false
    - kind: deny
      schedule: "* * * * *"
      duration: 24h
      applications:
        - mcpgateway-prod
      manualSync: false
