apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mcpgateway
  namespace: argocd
spec:
  description: GitOps boundaries for multi-environment deployment of cruvero-mcp-gateway.
  sourceRepos:
    - https://github.com/<ORG>/<REPO>.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: <APP>-dev
    - server: https://kubernetes.default.svc
      namespace: <APP>-staging
    - server: https://kubernetes.default.svc
      namespace: <APP>-prod
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: ""
      kind: ServiceAccount
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: PersistentVolumeClaim
    - group: apps
      kind: Deployment
    - group: autoscaling
      kind: HorizontalPodAutoscaler
    - group: policy
      kind: PodDisruptionBudget
    - group: networking.k8s.io
      kind: NetworkPolicy
    - group: networking.k8s.io
      kind: Ingress
    - group: cert-manager.io
      kind: Certificate
    - group: monitoring.coreos.com
      kind: ServiceMonitor
    - group: monitoring.coreos.com
      kind: PrometheusRule
    - group: traefik.io
      kind: ServersTransport
    - group: secrets.hashicorp.com
      kind: VaultAuth
    - group: secrets.hashicorp.com
      kind: VaultStaticSecret
  orphanedResources:
    warn: true
    ignore:
      - group: ""
        kind: ConfigMap
        name: kube-root-ca.crt
      - group: ""
        kind: ServiceAccount
        name: default
