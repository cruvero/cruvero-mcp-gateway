apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mcpgateway
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  ignoreApplicationDifferences:
    - jsonPointers:
        - /spec/source/helm/parameters
  generators:
    - list:
        elements:
          - env: dev
            namespace: cruvero-dev
            valuesFile: values-dev.yaml
            targetRevision: dev
  template:
    metadata:
      name: 'mcpgateway-{{ .env }}'
      labels:
        app.kubernetes.io/name: mcpgateway
        app.kubernetes.io/part-of: cruvero-mcp-gateway
        environment: '{{ .env }}'
    spec:
      project: mcpgateway
      source:
        repoURL: https://github.com/cruvero/cruvero-mcp-gateway.git
        targetRevision: '{{ .targetRevision }}'
        path: charts/mcpgateway
        helm:
          valueFiles:
            - values.yaml
            - '{{ .valuesFile }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
        automated:
          prune: true
          selfHeal: true
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
            - /metadata/annotations/deployment.kubernetes.io~1revision
        - group: ""
          kind: Service
          jsonPointers:
            - /spec/clusterIP
            - /spec/clusterIPs
  templatePatch: |
    {{- if eq .env "dev" }}
    metadata:
      labels:
        image-updater: mcpgateway
      annotations:
        argocd-image-updater.argoproj.io/image-list: "mcpgateway=harbor.dev.gchinfo.com/cruvero/cruvero-mcp-gateway:dev"
        argocd-image-updater.argoproj.io/mcpgateway.update-strategy: digest
        argocd-image-updater.argoproj.io/mcpgateway.helm.image-name: image.repository
        argocd-image-updater.argoproj.io/mcpgateway.helm.image-tag: image.tag
    {{- end }}
