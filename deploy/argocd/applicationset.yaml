apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mcpgateway
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions:
    - missingkey=error
  generators:
    - list:
        elements:
          - env: dev
            namespace: mcpgateway-dev
            valuesFile: values-dev.yaml
            targetRevision: dev
            autoSync: true
            prune: true
            selfHeal: true
          - env: staging
            namespace: mcpgateway-staging
            valuesFile: values-staging.yaml
            targetRevision: main
            autoSync: false
            prune: false
            selfHeal: false
          - env: prod
            namespace: mcpgateway-prod
            valuesFile: values-prod.yaml
            targetRevision: main
            autoSync: false
            prune: false
            selfHeal: false
  template:
    metadata:
      name: 'mcpgateway-{{ .env }}'
      labels:
        app.kubernetes.io/name: mcpgateway
        app.kubernetes.io/part-of: cruvero-mcp-gateway
        env: '{{ .env }}'
    spec:
      project: mcpgateway
      source:
        repoURL: https://github.com/cruvero/cruvero-mcp-gateway.git
        targetRevision: '{{ .targetRevision }}'
        path: charts/mcpgateway
        helm:
          valueFiles:
            - values.yaml
            - '{{ .valuesFile }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: '{{ .namespace }}'
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
        {{- if .autoSync }}
        automated:
          prune: {{ .prune }}
          selfHeal: {{ .selfHeal }}
        {{- end }}
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/replicas
            - /metadata/annotations/deployment.kubernetes.io~1revision
        - group: ""
          kind: Service
          jsonPointers:
            - /spec/clusterIP
            - /spec/clusterIPs
