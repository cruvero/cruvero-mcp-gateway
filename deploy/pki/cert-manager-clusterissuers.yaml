apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: <SERVER_ISSUER>
  labels:
    app.kubernetes.io/part-of: cruvero-mcp-gateway
spec:
  vault:
    server: https://<VAULT_HOST>
    path: <PKI_PATH>/sign/<SERVER_SIGN_ROLE>
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: <VAULT_K8S_ROLE>
        serviceAccountRef:
          name: cert-manager
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: <CLIENT_ISSUER>
  labels:
    app.kubernetes.io/part-of: cruvero-mcp-gateway
spec:
  vault:
    server: https://<VAULT_HOST>
    path: <PKI_PATH>/sign/<CLIENT_SIGN_ROLE>
    auth:
      kubernetes:
        mountPath: /v1/auth/kubernetes
        role: <VAULT_K8S_ROLE>
        serviceAccountRef:
          name: cert-manager
